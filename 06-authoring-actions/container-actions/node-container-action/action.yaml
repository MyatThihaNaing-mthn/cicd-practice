name: Hello (JavaScript)
description: Greet someone and expose a greeting output
inputs:
  who-to-greet:
    description: Name to greet
    required: true
    default: World
outputs:
  greeting:
    description: The greeting that was printed in Js container
runs:
  using: docker
  # Option A – let GitHub build from Dockerfile each run
  image: Dockerfile
  args:
    - ${{ inputs.who-to-greet }}
